# Task configuration — QuantArtifact
#
# All values VERIFIED against lm-evaluation-harness v0.4.12 on 2026-08-23.
# Vendored source configs: vendor/lm-eval-configs/.  Derivation: notes/harness-configs.md.
# Do NOT edit token budgets after the pre-registration freeze (2026-09-02).

harness:
  package: lm-eval
  version: "0.4.12"
  git_tag: v0.4.12
  # Prompts must be BYTE-FOR-BYTE identical to this version's rendering (gate G2).
  # lm-eval is a VALIDATION INSTRUMENT ONLY (EXECUTOR-TASKS.md O9 / §3.4).
  # All experimental generation goes through our generate.py.

defaults:
  # Framework default from lm_eval/models/vllm_causallms.py: max_gen_toks: int = 256.
  # Set explicitly here because it is a BACKEND default, not a benchmark property.
  max_gen_toks_framework_default: 256
  add_bos_token: true          # Red Hat: quantized models are BOS-sensitive
  temperature: 0.0
  do_sample: false
  seed: 0
  decoding: greedy

# ---------------------------------------------------------------------------
# Token-budget levels (H1). FROZEN as absolute integers before any results.
# 1x = the harness default for that task. Sweep arms run 2x and 4x only;
# 1x comes free from the reference run (prefix-nested subsample, O8).
# ---------------------------------------------------------------------------
budget_levels: ["1x", "2x", "4x"]

tasks:

  gsm8k:
    # answer_marker = HASH level (planner ruling R1.1).
    #
    # ⚠️ CORRECTION, verified 2026-08-25: this task is NOT non-CoT. It has
    # `fewshot_split: train` with `doc_to_target: "{{answer}}"`, and GSM8K train
    # answers are multi-step worked solutions with <<...>> calculator
    # annotations ending in "#### N". Confirmed by fetching train rows. So its
    # 5 exemplars ARE chain-of-thought and demonstrate `####` five times.
    # An earlier note here claiming otherwise was wrong; so is
    # EXECUTOR-PLAN.md 2.1's "instruction-tuned models essentially never emit
    # ####" as applied to THIS task.
    #
    # Its role: the ARBITRARY-marker level of the answer_marker factor, and the
    # pairing arXiv:2601.14277 measured (so Anchor C is reproducible).
    answer_marker: hash
    lm_eval_task: gsm8k
    dataset_path: openai/gsm8k
    dataset_name: main
    split: test
    output_type: generate_until
    num_fewshot: 5
    fewshot_source: sampled_from_train      # NOT hardcoded in the YAML
    doc_to_text: "Question: {{question}}\nAnswer:"
    n_items_reference: 1319                  # full test set (O8)
    n_items_sweep: 500                       # prefix-nested subset of the 1319
    subsample_seed: 20260823
    subsample_mode: prefix_nested            # 500 MUST be a prefix of the 1319 ordering
    max_gen_toks:
      1x: 256                                # framework default, set explicitly
      2x: 512
      4x: 1024
    until: ["Question:", "</s>", "<|im_end|>"]
    strict_regex: '#### (\-?[0-9\.\,]+)'
    flexible_regex: '(-?[$0-9.,]{2,})|(-?[0-9]+)'
    flexible_group_select: -1
    answer_type: numeric

  gsm8k_cot:
    # answer_marker = PHRASE level (planner ruling R1.1).
    #
    # 8-shot CoT, exemplars HARDCODED in the YAML (sampler: first_n) so the
    # prompt is fully determined with no sampling seed. strict-match regex is
    # `The answer is (...)`, a NATURAL-LANGUAGE marker the exemplars explicitly
    # demonstrate -- so a well-behaved chat model can satisfy it.
    answer_marker: phrase
    lm_eval_task: gsm8k_cot
    dataset_path: openai/gsm8k
    dataset_name: main
    split: test
    output_type: generate_until
    num_fewshot: 8
    fewshot_source: hardcoded_in_yaml
    doc_to_text: "Q: {{question}}\nA:"
    n_items_reference: 1319
    n_items_sweep: 500
    subsample_seed: 20260823
    subsample_mode: prefix_nested
    max_gen_toks:
      1x: 256
      2x: 512
      4x: 1024
    until: ["Q:", "</s>", "<|im_end|>"]
    strict_regex: 'The answer is (\-?[0-9\.\,]+).'
    flexible_regex: '(-?[$0-9.,]{2,})|(-?[0-9]+)'
    flexible_group_select: -1
    answer_type: numeric

  gsm8k_cot_hashmarker:
    # ⚠️ SYNTHETIC ARM — NOT harness-verbatim. Planner ruling R9.
    #
    # WHY IT EXISTS. gsm8k and gsm8k_cot differ in FOUR ways, not one:
    #   (a) marker            "#### N" vs "The answer is N."  <- the intended contrast
    #   (b) shots             5 vs 8
    #   (c) exemplar content  SAMPLED from train vs 8 hardcoded
    #   (d) until             ["Question:",...] vs ["Q:",...]
    # and (b)/(c) run TOWARD our own hypothesis -- 8 clean hand-written exemplars
    # should teach format compliance better than 5 sampled ones carrying
    # <<48/2=24>> calculator noise, predicting higher gsm8k_cot compliance for
    # reasons unrelated to marker naturalness. A caveat cannot fix a bias that
    # runs our way, so the marker contrast needs an identified arm.
    #
    # CONSTRUCTION: gsm8k_cot's prompt VERBATIM with ONLY the exemplar terminator
    # rewritten "The answer is N." -> "#### N". Shots, exemplar text, the Q:/A:
    # scaffold and `until` are all inherited from gsm8k_cot, so (b)(c)(d) are
    # controlled simultaneously. Asserted: exactly num_fewshot substitutions, and
    # never zero (a zero-substitution arm would be a null contrast that looks real).
    #
    # THE MARKER EFFECT IS ESTIMATED FROM THE MATCHED PAIR ONLY
    # (gsm8k_cot vs gsm8k_cot_hashmarker). `gsm8k` does NOT enter it.
    synthetic: true
    harness_verbatim: false
    answer_marker: hash
    base_task: gsm8k_cot
    prompt_transform: to_hash_marker
    dataset_path: openai/gsm8k
    dataset_name: main
    split: test
    output_type: generate_until
    num_fewshot: 8
    fewshot_source: hardcoded_in_yaml        # inherited from gsm8k_cot
    # 500 items x 9 cells (3 models x {bf16, gptq-4bit, awq-4bit}) = 4,500.
    # It estimates ONE contrast whose published magnitude is 41-64 points
    # (arXiv:2601.14277 App. B), so n=500 resolves it with room to spare. It is a
    # marker x precision interaction, so it does NOT need bnb-NF4 or GPTQ-8bit,
    # whose role is dose-response on the reference condition only.
    n_items: 500
    subsample_seed: 20260823
    subsample_mode: prefix_nested            # prefix of the same 1319 ordering
    precisions: [bf16, gptq-4bit, awq-4bit]
    max_gen_toks:
      1x: 256
      2x: 512
      4x: 1024
    until: ["Q:", "</s>", "<|im_end|>"]      # inherited from gsm8k_cot
    strict_regex: '#### (\-?[0-9\.\,]+)'
    flexible_regex: '(-?[$0-9.,]{2,})|(-?[0-9]+)'
    flexible_group_select: -1
    answer_type: numeric

  # -------------------------------------------------------------------------
  # BBH x 6 — the FORMAT GRADIENT (free-form -> boolean -> multiple-choice).
  # This is a prediction of the hypothesis, not six arbitrary tasks (§2.2).
  # All six share vendor/lm-eval-configs/bbh/_cot_fewshot_template_yaml:
  #   max_gen_toks: 1024, num_fewshot: 3 (hardcoded), target_delimiter: ""
  #   until: ["</s>", "Q", "\n\n"]     <-- bare capital Q; see PROBLEM 2
  #   filter: (?<=the answer is )(.*)(?=.)   <-- case-sensitive, lowercase
  # -------------------------------------------------------------------------
  bbh:
    lm_eval_task_prefix: bbh_cot_fewshot_
    dataset_path: SaylorTwift/bbh
    split: test
    output_type: generate_until
    num_fewshot: 3
    fewshot_source: hardcoded_in_yaml
    doc_to_text: "Q: {{input}}\nA: Let's think step by step.\n"
    # Per-subtask counts, NOT a flat 150 (planner ruling R1.3). The format
    # gradient's three levels are: 4 free-form subtasks POOLED (n=600), then
    # boolean_expressions ALONE, then logical_deduction_five_objects ALONE.
    # At n=150 a single-subtask level cannot detect anything under ~7.2pp
    # (paired binary, 80% power, p_d=0.10), so two of the three gradient levels
    # would be unpowered. The two single-subtask CONTRAST levels are therefore
    # raised to the full 250 available; the four pooled free-form stay at 150.
    # +8,400 generations (~6%), targeted precisely. Do NOT add subtasks.
    n_items_default: 150
    subsample_seed: 20260823
    max_gen_toks:
      1x: 1024
      2x: 2048
      4x: 4096
    until: ["</s>", "Q", "\n\n"]
    strict_regex: '(?<=the answer is )(.*)(?=.)'
    strict_regex_case_sensitive: true        # log every capitalization-variant failure
    # ⚠️ VERIFIED DEFECT (2026-08-25): this regex is greedy with a MANDATORY
    # trailing lookahead `(?=.)`, so it DROPS THE FINAL CHARACTER whenever the
    # generation ends exactly at the answer:
    #   "the answer is 42"   -> "4"
    #   "So the answer is False" -> "Fals"
    #   "the answer is (B)"  -> "(B"
    # Correct only when trailing punctuation supplies the lookahead character.
    # This fires in practice because `until` contains a bare "Q" and "\n\n",
    # either of which can end the text right at the answer. Rung 1 stays
    # VERBATIM -- we measure the defect, we do not patch it. Rung 2 recovers it,
    # and the gap is the measured artifact. Tested in tests/test_extract.py.
    strict_regex_drops_final_char: true
    subtasks:
      - name: word_sorting
        format_class: free_form
        n_items: 150
        gradient_role: pooled_free_form
      - name: dyck_languages
        format_class: free_form
        n_items: 150
        gradient_role: pooled_free_form
      - name: multistep_arithmetic_two
        format_class: free_form
        answer_type: numeric
        n_items: 150
        gradient_role: pooled_free_form
      - name: object_counting
        format_class: free_form
        answer_type: numeric
        n_items: 150
        gradient_role: pooled_free_form
      - name: boolean_expressions
        format_class: boolean
        n_items: 250                        # RAISED per R1.3 -- single-subtask contrast level
        gradient_role: contrast_level
      - name: logical_deduction_five_objects
        format_class: multiple_choice
        n_items: 250                        # RAISED per R1.3 -- single-subtask contrast level
        gradient_role: contrast_level

  # -------------------------------------------------------------------------
  # H6 NEGATIVE CONTROL — THREE arms, not two (planner ruling R4).
  #
  # EXECUTOR-TASKS.md 2.2 claimed "the gap between the modes IS the extraction
  # cost, measured directly". It was not: the two harness tasks differ in PROMPT
  # CONTENT and ANSWER SPACE, not just in scoring mode. arc_challenge is
  # "Question: ...\nAnswer:" scored over answer TEXTS; arc_challenge_chat is a
  # full A/B/C/D instruction scored on a generated LETTER.
  #
  # (An earlier note here claimed the confound was SHOT COUNT. That was wrong:
  # arc_easy.yaml has no num_fewshot field at all, so BOTH arms are 0-shot.
  # Verified 2026-08-25 -- grep returns 0 occurrences.)
  #
  # Arm 1 vs arm 2 is a BYTE-IDENTICAL-PROMPT contrast where the only thing
  # varying is whether the answer is generated-then-extracted or read off a
  # likelihood ranking. THAT is the extraction cost, measured directly.
  # Arm 2 costs NO generation -- 4 single-token scorings on a computed prefix.
  # -------------------------------------------------------------------------

  arc_challenge_ll_matched:
    # ARM 2. Byte-identical prompt to arm 1; log-likelihood over the four
    # option letters. Extraction surface ABSENT.
    arc_arm: 2
    prompt_source: arc_challenge_chat        # MUST be byte-identical to arm 1
    scoring_mode: loglikelihood
    # WITH the leading space (planner ruling R11). gen_prefix ends
    # "...The best answer is" with NO trailing space, so the continuation the
    # GENERATIVE arm must emit begins with one. Scoring "A" instead would measure
    # a tokenization the model essentially never produces after "is", and that
    # penalty varies by model AND precision -- exactly the artifact shape that
    # would manufacture an H6 result on the never-cut negative control.
    # Corroboration: lm-eval's default target_delimiter is " ", so native ARC-C
    # log-likelihood already scores space-prefixed continuations.
    continuations: [" A", " B", " C", " D"]
    # ⚠️ Token ids are obtained by tokenizing IN CONTEXT and differencing, not by
    # encoding the continuation standalone. Measured 2026-08-26: standalone " A"
    # is 1 token on Qwen/Llama (byte BPE, 'GA') but 2 on Phi-3.5 (SentencePiece,
    # ['_','_A'], because '_A' already encodes the space). In context all three
    # give a single token. "Always prefix a space" is the wrong rule; differencing
    # is correct for every tokenizer convention.
    continuation_tokenization: in_context_difference
    assert_single_token_per_option: true     # R11 guard #1; ids recorded per model
    n_items: 500
    item_ids_shared_with: arc_challenge_chat
    max_gen_toks: null                       # no generation at all
    role: "extraction surface absent — the counterfactual for arm 1"

  arc_challenge:
    # ARM 3. Harness-verbatim log-likelihood over answer TEXTS. Kept for
    # comparability with published ARC-C numbers, NOT as the H6 counterfactual.
    # G3 cross-validation target (our acc/acc_norm within 0.5pp of lm-eval's).
    arc_arm: 3
    lm_eval_task: arc_challenge
    dataset_path: allenai/ai2_arc
    dataset_name: ARC-Challenge
    split: test
    output_type: multiple_choice
    scoring_mode: loglikelihood
    doc_to_text: "Question: {{question}}\nAnswer:"
    doc_to_choice: answer_texts               # choice TEXTS, not letters
    metrics: [acc, acc_norm]
    n_items: 500
    subsample_seed: 20260823
    max_gen_toks: null                        # not a generative task

  arc_challenge_chat:
    # ARM 1. Generative scoring: extraction surface PRESENT.
    # num_fewshot is 0 BY DESIGN in the harness (llama-tagged task) -- as is
    # arm 3, so the mode contrast is NOT confounded with shot count.
    arc_arm: 1
    lm_eval_task: arc_challenge_chat
    dataset_path: allenai/ai2_arc
    dataset_name: ARC-Challenge
    split: test
    output_type: generate_until
    scoring_mode: generate
    num_fewshot: 0
    gen_prefix: "The best answer is"
    n_items: 500
    subsample_seed: 20260823
    item_ids_shared_with: arc_challenge       # MUST be the identical 500 IDs
    # ⚠️ The chat template hard-codes A-D:
    #   {% if choices.text|length > 3 %}\nD. {{choices.text[3]}}{% endif %}
    # so a 5-choice ARC-C item SILENTLY LOSES its fifth choice, and if the gold
    # IS the dropped choice the item is unanswerable -- guaranteed wrong for
    # every arm, which would show up as a fake competence effect.
    # RESTRICT the 500-item sample to 4-choice items and REPORT the exclusions.
    restrict_to_n_choices: 4
    report_choice_count_exclusions: true
    max_gen_toks:
      1x: 100
      2x: 200
      4x: 400
    until: ["\n\n", "."]                      # a single period; see PROBLEM 2
    strict_filter: remove_whitespace
    metric_ignore_case: true
    metric_ignore_punctuation: true
    answer_type: multiple_choice_letter

# ---------------------------------------------------------------------------
# Cross-variant scoring rule — see notes/harness-configs.md §5 (PROBLEM 3).
# The harness scores BBH few-shot STRICTLY HARSHER than BBH zero-shot
# (cot_fewshot has ignore_case off and no regexes_to_ignore; cot_zeroshot has
# both). Inheriting each variant's own metric config would confound H5.
# DECISION: our four rungs are applied IDENTICALLY across prompt variants.
# Reported as a documented deviation from harness-verbatim scoring for the
# zero-shot arm only. Does not affect G2, which tests prompts not metrics.
# ---------------------------------------------------------------------------
scoring_held_fixed_across_prompt_variants: true

# ---------------------------------------------------------------------------
# H5 — WIDENED per planner ruling R3. As originally specified H5 was
# UNINTERPRETABLE, and the reason is worse than the metric-normalization issue
# above. Comparing the two BBH templates:
#
#                     _cot_fewshot (v4.0)   _cot_zeroshot (v3.0)
#   max_gen_toks      1024                  ABSENT -> default 256   <-- 4x GAP
#   until             ["</s>","Q","\n\n"]   ["</s>","Q:","<|im_end|>"]
#   filter_list       get-answer regex      NONE AT ALL
#   metric            ignore_case off       ignore_case on + 5 regexes_to_ignore
#
# So BOTH truncation mechanisms differed between the H5 arms -- and the
# generation budget is H1's OWN INDEPENDENT VARIABLE. H5 would have measured
# prompt format + budget + stop sequences + metric normalization at once.
#
# FIX: hold everything except prompt text fixed across the two variants.
# ---------------------------------------------------------------------------
h5_held_fixed:
  max_gen_toks_from: fewshot          # 1024 for BBH, not the zero-shot 256
  until_from: fewshot                 # the few-shot stop list for both
  rungs: all_four_identical
  only_prompt_text_varies: true
  documented_deviation: "zero-shot arm departs from harness-verbatim scoring AND generation config; enumerated in the appendix"

prompt_variants:
  fewshot_cot:
    reference: true
  zeroshot:
    reference: false
    # gsm8k_cot ONLY, not both answer_marker levels. Planner ruling R10:
    # answer_marker is NESTED WITHIN few-shot, not crossed with prompt_format.
    # The marker is carried BY THE EXEMPLARS -- strip them and nothing conveys
    # "####" except an explicit instruction, which is a different manipulation
    # (instruction-following, not exemplar-imitation). The zero-shot x hash cell
    # would score ~0 at rung 1 for a trivial reason, and A FLOOR EFFECT CANNOT
    # SUPPORT AN INTERACTION TEST. The absence is declared and explained in the
    # prereg rather than left as an unexplained gap in the design.
    applies_to: [gsm8k_cot, bbh]              # H5 arm, 9 cells x 1400 items
    answer_marker_nested_within_fewshot: true

# ---------------------------------------------------------------------------
# Chat template — FIXED, not a factor (planner ruling R1.2).
#
# arXiv:2601.14277 reports F16 GSM8K strict 24.64 vs flexible 77.63 DESPITE
# 5-shot exemplars that demonstrate ####. The likely cause is
# --apply_chat_template, which wraps the whole few-shot block into ONE user turn
# and makes instruction-tuned models revert to their own prose format.
#
# We do NOT add chat_template as a factor -- that is another ~2x. We fix it ON,
# single-turn, for every arm, state it with the citation, and run one small
# probe with it OFF to quantify what we held fixed.
# ---------------------------------------------------------------------------
chat_template:
  apply: true
  mode: single_turn                   # entire few-shot block in one user turn
  is_a_factor: false
  cite: "arXiv:2601.14277"
  # ⚠️ add_bos_token=true + a chat template = DOUBLE BOS. Red Hat's
  # add_bos_token tip is for NON-template use. A silent double BOS shifts
  # scores and would confound every arm.
  # MANDATORY: log the final token IDs of one rendered prompt per model and
  # ASSERT exactly one leading BOS. Gate G2 checks this.
  assert_single_leading_bos: true
  off_probe:
    # Pre-empts "why didn't your strict scores collapse like theirs?"
    enabled: true
    model: qwen2.5-3b
    precisions: [bf16, gptq-4bit]
    task: gsm8k
    n_items: 500
    apply_chat_template: false
    approx_generations: 2000

# ---------------------------------------------------------------------------
# Item counts per cell (EXECUTOR-TASKS.md §2.2)
#   Reference:  gsm8k 1319 + bbh 900 + arc 500(x2 modes) = 2719 generative
#   Sweep/0shot: gsm8k 500 + bbh 900                     = 1400
# ---------------------------------------------------------------------------
# Revised per planner ruling R6. Supersedes the EXECUTOR-TASKS.md 2.6 table.
# A6's MEASURED throughput supersedes this in turn.
#   99,000  2.6 baseline
#  +19,785  D6 second GSM8K variant (answer_marker factor)
#   +8,400  R1.3 BBH contrast subtasks 150 -> 250
#   +2,000  R1.2 chat-template off-probe
#   +4,500  R9 gsm8k_cot_hashmarker synthetic matched arm (500 x 9 cells)
#       +0  R4 ARC arm 2 (log-likelihood, no generation)
#       +0  R10 zero-shot stays one marker level (no new cells)
#       +0  R1.4 rung 1b and R3 stop-seq analysis (pure re-scoring)
#  =======
# ~133,500
item_counts:
  reference_generative_per_cell: 2719
  sweep_per_cell: 1400
  zeroshot_per_cell: 1400
  revised_total_estimate: 133500
  # Determinism audit (job 2 / A7), recorded per planner ruling R13.7 rather than
  # left to drift. §2.6's original ~13,500 was too low: it predated the
  # non-monotonicity level (R12.3.1), the ordering confirmation (R13.1) and the
  # model-generality probe (R12.3.3).
  #
  # The spread is CONDITIONAL, which is the point: the sweep costs 2 levels when the
  # top value is stable and up to 4 when it is not, so the audit is cheap when the
  # answer is good news and expensive only when the frontier is genuinely
  # informative. Pre-specified as a contingency in analysis/preregistration.md, so it
  # reads as a plan rather than a post-hoc expansion.
  # ⚠️ REVISED AGAIN by R15, and upward. R13.7's 23,000 assumed a descending sweep on
  # the REPEAT axis with early exit. R15.4 retired that criterion outright -- it
  # measured an axis with no variance and called a 65%-order-unstable arm "stable" --
  # so the sweep now measures ORDER-induced divergence at three fixed levels
  # {8,32,64}, and R15.2 puts the full arm ladder in it because AWQ is the prediction
  # test (it HAS the guard GPTQ lacks).
  #
  # 5 arms x 3 levels x 4 passes x 500 = 30,000, plus Marlin 2,000 + autotune 2,000 +
  # Phi 4,000. Four passes per cell = 2 at ordering 0 (the repetition floor §9 binds
  # to) + 2 reordered (order sensitivity), ALL IN ONE ENGINE so ordering is not
  # confounded with process state.
  #
  # The TIME estimate is unchanged (~4.8 h at the measured blended rate, against the
  # planner's predicted 4-6 h); it is the generation COUNT that grew.
  determinism_audit: 38000
  determinism_audit_breakdown: "sweep 30,000 + Marlin 2,000 + autotune 2,000 + Phi 4,000"
  determinism_audit_supersedes: "R13.7's 23,000, which assumed the retired repeat-axis sweep"
  supersedes: "EXECUTOR-TASKS.md 2.6 table (99,000)"
