# Scoring configuration — QuantArtifact
#
# The four rungs, declaratively. ALL FOUR are applied to EVERY stored
# generation, at ZERO extra generation cost -- this is the architectural
# consequence that makes H3 answerable by re-scoring (EXECUTOR-PLAN.md 2.1).
#
# 🎯 THE HEADLINE IS RUNG 1 vs RUNG 2 -- deterministic, auditable, and
# independent of the judge. That is what makes judge validation NON-BLOCKING.
# Rungs 3-4 are robustness.
#
# Rules here are the executable form of analysis/preregistration.md 5.
# Changing any rung after the Sep 2 freeze requires a version bump and a
# dated amendment.

versioning:
  # Scorer outputs are keyed by (cell, scorer_name, scorer_version).
  # BUMP THE VERSION ON ANY CHANGE. NEVER OVERWRITE.
  extract_version: "1.0.0"
  compliance_version: "1.0.0"
  trace_scan_version: "1.0.0"
  judge_version: "1.0.0"

rungs:

  # -------------------------------------------------------------------------
  # RUNG 1 — strict. The published harness regex, VERBATIM. This is what
  # prior work reports. Per-task, because the harness differs per task.
  # -------------------------------------------------------------------------
  strict:
    order: 1
    deterministic: true
    per_task:
      gsm8k:
        regex: '#### (\-?[0-9\.\,]+)'
        take: first
      gsm8k_cot:
        regex: 'The answer is (\-?[0-9\.\,]+).'
        take: first
      bbh:
        regex: '(?<=the answer is )(.*)(?=.)'
        take: first
        # CASE-SENSITIVE lowercase lookbehind. Every capitalization-variant
        # failure is LOGGED AND COUNTED -- it is a concrete, citable
        # brittleness and a likely source of the effect, not an error to swallow.
        case_sensitive: true
        log_capitalization_failures: true
      arc_challenge_chat:
        filter: remove_whitespace
        take: first
        ignore_case: true
        ignore_punctuation: true

  # -------------------------------------------------------------------------
  # RUNG 2 — permissive. THE WORKHOLE. Deterministic, documented,
  # pre-registered. Ordered: FIRST rule that yields a candidate wins.
  # -------------------------------------------------------------------------
  permissive:
    order: 2
    deterministic: true
    rules:
      - id: boxed
        desc: "innermost complete \\boxed{...} group"
      - id: commitment_phrase
        desc: "case-INSENSITIVE commitment phrase; take the span after it"
        phrases: ["the answer is", "answer:", "final answer is", "the best answer is", "so the answer is"]
      - id: hash_marker
        desc: "#### marker if present"
      - id: last_number
        desc: "last number in string, numeric-answer tasks only"
        regex: '(-?[$0-9.,]{2,})|(-?[0-9]+)'
        group_select: -1
      - id: last_option_letter
        desc: "last standalone A-E option letter, optionally parenthesised; MC tasks only"
    # Applied to the candidate, IN THIS ORDER.
    normalisation:
      - strip_whitespace
      - strip_currency          # $ EUR GBP %
      - strip_thousands_separators   # , and _
      - strip_single_trailing_period
      - strip_latex_wrappers    # \! \, \; \left \right \$ \% \text{...}
      - minerva_normalize_final_answer
      - collapse_internal_whitespace
    empty_after_normalisation_is_no_candidate: true

  # -------------------------------------------------------------------------
  # RUNG 3 — math-verify. Symbolic/numeric equivalence. Numeric tasks only.
  # -------------------------------------------------------------------------
  math_verify:
    order: 3
    deterministic: true
    package: math-verify
    version: "0.9.0"
    install: 'pip install "math-verify[antlr4_13_2]"'
    numeric_tasks_only: true
    # ⚠️ parse()/verify() use signal.alarm() and RAISE IN WORKER THREADS.
    # Pass these and impose our own timeout instead.
    parsing_timeout: null
    timeout_seconds: null
    external_timeout_seconds: 10
    # It is intentionally ASYMMETRIC -- gold/target order matters. Fixed as:
    call_order: "verify(gold, prediction)"
    # Timeout / exception / parse failure => recorded INCORRECT with `notes`
    # set. NEVER silently dropped. The timeout count is reported.
    on_failure: record_incorrect_with_note
    report_timeout_count: true
    # Independent evaluation puts math-verify at 45.6% F1 overall and 16.1 F1
    # on out-of-distribution answer formats (xVerify paper) -- so it is a FAST
    # PATH, not a trusted oracle. Let the judge handle what it cannot.

  # -------------------------------------------------------------------------
  # RUNG 4 — judge. Validated against humans (A12), never assumed.
  # -------------------------------------------------------------------------
  judge:
    order: 4
    deterministic: false     # model inference, though greedy + fixed seed
    label_space: [A, B, C]   # CompassVerifier 3-way
    invalid_class: C
    invalid_maps_to: [ABSENT, TRUNCATED]
    # Our 3B models under 4-bit WILL emit truncated and repetitive output, so
    # a pure binary label space would force those into a correctness bucket.
    always_supply_reference_answer: true   # cuts GPT-4 math-grading failure 70% -> 15%
    instruction_borrowed: "compare ONLY the final answer (CompassVerifier)"
    decoding: {greedy: true, seed: 0, max_tokens: 1}
    measure_output_parse_rate: true   # VerifyBench found xVerify failing its own format
    validate_on_n_items_before_scaling: 50
    cascade:
      judge1:
        coverage: "full reference condition"
        sweep_rule: "judge ONLY where rung2 != rung3, OR rung2 == incorrect"
      judge2:
        coverage: "reference condition + human-validation sample only"
    # Reported in the paper.
    report_cascade_rule: true

# ---------------------------------------------------------------------------
# MONOTONICITY. Anything rung n marks correct, rung n+1 must also mark correct.
# Asserted on FIXTURES ONLY -- an empirical violation on real generations is a
# REPORTABLE RESULT, not a test failure. A violation on fixtures is a bug.
# ---------------------------------------------------------------------------
monotonicity:
  assert_on_fixtures: true
  assert_on_experimental_data: false
  on_experimental_violation: triage_and_record   # never ignore

# ---------------------------------------------------------------------------
# Compliance 2x2 (EXECUTOR-PLAN.md 2.3). ORTHOGONAL to correctness.
# Compliance rate is A DEPENDENT VARIABLE IN ITS OWN RIGHT.
# ---------------------------------------------------------------------------
compliance:
  labels:
    COMPLIANT:   "answer present in canonical expected format (rung 1 succeeds)"
    RECOVERABLE: "no canonical format, but rung 2 finds a committed final answer"
    ABSENT:      "no identifiable answer (degeneration, refusal, or truncation)"
  # Truncation is recorded SEPARATELY and orthogonally: a generation can be
  # BOTH truncated and ABSENT, and conflating them loses the mechanism.
  truncation_is_orthogonal: true

# ---------------------------------------------------------------------------
# Termination classes — CORRECTS the naive TRUNCATED = finish_reason=="length".
# See notes/harness-configs.md 4 and preregistration.md 4.
# BBH's `until` includes a BARE CAPITAL "Q" and a blank line; ARC-chat stops on
# a SINGLE PERIOD with a 100-token cap. Those cut generations mid-reasoning and
# report finish_reason == "stop", so the naive definition undercounts badly.
# ---------------------------------------------------------------------------
termination_classes:
  TRUNC_BUDGET:
    rule: 'finish_reason == "length"'
    primary_for_h1: true          # it is what the budget sweep manipulates
  TRUNC_STOPSEQ:
    rule: 'finish_reason == "stop" AND stop_reason is a harness `until` string AND rung2 finds no committed answer'
    # Reported alongside as a distinct measurement artifact on the same
    # mechanism, and useful as an INTERNAL CONTROL because it should NOT
    # respond to the budget sweep.
    primary_for_h1: false
    is_internal_control: true
  COMPLETE:
    rule: 'EOS, or a stop sequence WITH a committed answer present'

# ---------------------------------------------------------------------------
# H2 trace scan. Both variants computed, BOTH reported.
# ---------------------------------------------------------------------------
trace_scan:
  permissive:
    rule: "normalised gold appears anywhere in generation_text"
  conservative:
    rule: "normalised gold in final 20% OR after a commitment phrase, AND rung2 extraction != gold"
    final_fraction: 0.20
    commitment_phrases: ["the answer is", "therefore", "so", "\\boxed{"]
  # 🚨 MANDATORY CALIBRATION, or the number is meaningless: the base rate of
  # INCIDENTAL gold appearance in traces where extraction SUCCEEDED AND WAS
  # WRONG. That is the false-positive floor. The headline H2 number is always
  # reported NET OF this floor, with the floor printed next to it.
  false_positive_floor:
    required: true
    definition: "gold-in-trace rate among items where rung2 extracted successfully and was incorrect"
  # Single-digit golds have a high incidental match rate; reported separately.
  small_gold_stratum:
    abs_value_below: 10
    report_separately: true
