# SMInterface job configuration — THE compute path (decision D14).
#
# D14 overrides EXECUTOR-TASKS.md O4: SMInterface is the ONLY substrate. EC2 is
# withdrawn. The reason it is also the right call: SageMaker training jobs QUEUE
# for capacity, while EC2 RunInstances fails immediately -- and g6e.2xlarge was
# unavailable in 10 AZs across three regions.
#
# Submit with:  python scripts/submit_job.py --stage <stage> [--i-have-confirmation]
# Fields map 1:1 onto SMInterface's JobConfig dataclass.

# ---------------------------------------------------------------------------
# Hardware — 1 x L40S 48GB, SM89. Quota VERIFIED 2026-08-26:
#   ml.g6e.2xlarge for training job usage      = 1  (us-west-2 AND us-east-1)
#   ml.g6e.2xlarge for spot training job usage = 1
# ---------------------------------------------------------------------------
instance_type: ml.g6e.2xlarge
instance_count: 1

# MUST stay false. tensor_parallel_size>1 breaks batch invariance (vLLM #51290),
# which is the single most important determinism setting in the study.
distributed: false

# ---------------------------------------------------------------------------
# Overrides of SMInterface defaults that O4 correctly flagged as hazards
# ---------------------------------------------------------------------------
# Default is 3600s. A reference-run cell is 2,719 items; 1 hour would kill it
# mid-run. 24h per job, resumable, so a timeout costs one batch not one cell.
max_run: 86400

# Default is 30GB. Measured weight requirement is ~136GB plus judges (~34GB).
volume_size: 200

# On-demand first: quota is 1 either way, and spot interruption on a queued job
# adds a failure mode we do not need while the pipeline is still unproven.
# Flip to true (max_wait is auto-set to max_run) once runs are routine -- A4
# already checkpoints and resumes per batch, so interruption is survivable.
use_spot_instances: false

# ---------------------------------------------------------------------------
# Account / credentials. Account is CONDUIT-managed (D11).
# ---------------------------------------------------------------------------
# MUST match the ECR image's region -- SageMaker cannot pull cross-region.
region: us-east-1
profile: qa-gpu

# ⚠️ MUST be false. SMInterface's session.refresh_credentials() hardcodes
#   ada credentials update --profile=<p> --once
# with NO `--provider conduit`, so its auto-refresh CANNOT work on this account.
# scripts/submit_job.py refreshes correctly before submitting instead.
auto_refresh_credentials: false

# The role MedLLMSafety uses successfully in this same account. Note the
# `service-role/` PATH -- a plain list-roles scan misses it. AmazonSageMakerAdminIAMExecutionRole does NOT work: its trust policy omits sagemaker.amazonaws.com.
role: arn:aws:iam::654654594225:role/service-role/SageMaker-ExecutionRole-20240222T160995

output_path: s3://sagemaker-us-east-1-654654594225/johnyj02/QA/v0.1/

# ---------------------------------------------------------------------------
# 🚨 CHECKPOINTING — the highest-value engineering item, per the planner.
#
# /opt/ml/model uploads ONLY AT THE END of a job. A timeout or preemption at
# hour 15 of 20 therefore loses all 15 hours. checkpoint_s3_uri is different:
# SageMaker syncs /opt/ml/checkpoints to S3 CONTINUOUSLY during the run, and
# restores it into the container at start.
#
# So generations are written incrementally to /opt/ml/checkpoints, and every job
# skips join keys already present there. With ONE concurrent job slot and an
# unbounded per-job queue wait, losing a long job is the most expensive failure
# available to us.
# ---------------------------------------------------------------------------
checkpoint_s3_uri: s3://sagemaker-us-east-1-654654594225/johnyj02/QA/v0.1/checkpoints/
checkpoint_local_path: /opt/ml/checkpoints

# ---------------------------------------------------------------------------
# Container. framework: generic + a custom image.
#
# WHY NOT THE STOCK DLC: vLLM 0.26.0 pins torch to an EXACT version, and its
# PRECOMPILED _C.abi3.so links a specific libcudart independent of whatever the
# Python torch package pins. The sibling project verified this the expensive way
# (objdump on a real container) and ended up with a dedicated image. The stock
# PyTorch DLC ships a different torch, so pip-installing vllm over it is the
# failure mode we already know about. See notes/reuse.md §5.
#
# The image must ALSO retain a C compiler: VLLM_BATCH_INVARIANT substitutes
# batch-invariant Triton kernels which are JIT-compiled at RUNTIME. No compiler
# means no determinism, which kills H8 and invalidates every delta.
framework: generic

# TWO images, because llmcompressor and vllm cannot coexist (3.2's two-venv split).
#   serve : vllm 0.26.0 + torch 2.11.0 (cu130) -- generation, judging, determinism
#   quant : llmcompressor 0.12.0.1 + torch 2.6.0 (cu128) -- the quantize stage only
# submit_job.py selects per stage; image_uri below is the default (serve).
images:
  serve: 654654594225.dkr.ecr.us-east-1.amazonaws.com/johnyj02-qa:v0.1-20260826
  quant: null        # TODO: build with Dockerfile.quant
image_uri: 654654594225.dkr.ecr.us-east-1.amazonaws.com/johnyj02-qa:v0.1-20260826

# ---------------------------------------------------------------------------
# Environment — the frozen determinism contract (EXECUTOR-TASKS.md §3.3).
# generate.py asserts every one of these at startup and refuses to run if unset.
# ---------------------------------------------------------------------------
environment:
  VLLM_BATCH_INVARIANT: "1"
  VLLM_ENABLE_V1_MULTIPROCESSING: "0"
  VLLM_ATTENTION_BACKEND: "FLASH_ATTN"
  # Single GPU on this instance type anyway, but pinned and asserted regardless:
  # a 4-GPU instance is where the TP>1 mistake happens, and this is the habit.
  CUDA_VISIBLE_DEVICES: "0"
  TOKENIZERS_PARALLELISM: "false"
  # HF_TOKEN is injected by submit_job.py from the environment, never committed.

# ---------------------------------------------------------------------------
# Naming (D11). "QA" is project initials only and is NEVER expanded.
# job_name is set per-submission by submit_job.py as:
#   johnyj02-QA-v<x.x>-<date>-<uuid>-<stage>
# ---------------------------------------------------------------------------
tags:
  Owner: johnyj02
  Purpose: testing-QA
